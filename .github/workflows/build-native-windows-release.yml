name: Build Native Windows Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-native-windows-release.yml"
      - "project.godot"
      - "export_presets.cfg"
      - "Vulnus.csproj"
      - "Vulnus.sln"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-native-windows-release.yml"
      - "project.godot"
      - "export_presets.cfg"
      - "Vulnus.csproj"
      - "Vulnus.sln"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: "v0.2.0-rhythians"
      OLD_RELEASE_TAG: "v0.1.1-rhythians"
      GODOT_TEMPLATE_DIR: "3.7.dev1.mono"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 3.7-dev1 Mono for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.godotengine.org/?flavor=dev1&platform=windows.64&slug=mono_win64.zip&version=3.7" -OutFile "$env:RUNNER_TEMP\godot.zip"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\godot" | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot" -Force
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -File -Filter "Godot_v3.7-dev1_mono_win64.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) { throw "Godot 3.7-dev1 Mono Windows executable was not found." }
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $godot --version

      - name: Install Godot 3.7-dev1 Mono export templates
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.godotengine.org/?flavor=dev1&platform=templates&slug=mono_export_templates.tpz&version=3.7" -OutFile "$env:RUNNER_TEMP\templates.zip"
          $unpack = "$env:RUNNER_TEMP\godot-templates"
          New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\templates.zip" -DestinationPath $unpack -Force
          $dest = Join-Path $env:APPDATA "Godot\templates\$env:GODOT_TEMPLATE_DIR"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $inner = Join-Path $unpack "templates"
          if (Test-Path $inner) {
            Copy-Item "$inner\*" $dest -Recurse -Force
          } else {
            Copy-Item "$unpack\*" $dest -Recurse -Force
          }
          Get-ChildItem $dest | Select-Object -ExpandProperty Name

      - name: Install software OpenGL for Godot
        uses: f3d-app/install-mesa-windows-action@v3
        with:
          path: ${{ runner.temp }}\godot\Godot_v3.7-dev1_mono_win64

      - name: Build C# solution with Godot
        shell: pwsh
        run: |
          $stdout = "$env:RUNNER_TEMP\godot-build-out.log"
          $stderr = "$env:RUNNER_TEMP\godot-build-err.log"
          $arguments = "--no-window --verbose --quit --path `"$env:GITHUB_WORKSPACE`" --build-solutions"
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          $buildLogs = Join-Path $env:APPDATA "Godot\mono\build_logs"
          if (Test-Path $buildLogs) {
            Get-ChildItem $buildLogs -Recurse -Filter "msbuild_log.txt" | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName
            }
          }
          $assembly = "$env:GITHUB_WORKSPACE\.mono\temp\bin\Debug\Vulnus.dll"
          if (-not (Test-Path $assembly)) { throw "Godot C# build did not produce Vulnus.dll." }
          if ($process.ExitCode -ne 0) { Write-Warning "Godot exited with $($process.ExitCode) after producing Vulnus.dll; continuing." }

      - name: Export playable Windows x64 build
        shell: pwsh
        run: |
          $build = "$env:GITHUB_WORKSPACE\build"
          $exe = "$build\Vulnus.exe"
          $stdout = "$env:RUNNER_TEMP\godot-export-out.log"
          $stderr = "$env:RUNNER_TEMP\godot-export-err.log"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $arguments = "--no-window --verbose --path `"$env:GITHUB_WORKSPACE`" --export `"Windows Desktop`" `"$exe`""
          $process = Start-Process -FilePath $env:GODOT_BIN -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "Godot export timed out after 240 seconds."
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) { throw "Vulnus.exe was not created. Godot exit code: $($process.ExitCode)" }
          if ($process.ExitCode -ne 0) { Write-Warning "Godot exited with $($process.ExitCode) after producing Vulnus.exe; continuing." }
          Get-ChildItem $build -Recurse | Select-Object FullName,Length

      - name: Package playable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\build\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\Vulnus-Windows-x64.zip" -Force
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\dist\Vulnus-Windows-x64.zip")) { throw "Release ZIP was not created." }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulnus-Windows-x64
          path: dist/Vulnus-Windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" -f sha="$env:GITHUB_SHA" -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not move release tag $env:RELEASE_TAG to $env:GITHUB_SHA." }
            gh release upload $env:RELEASE_TAG "dist/Vulnus-Windows-x64.zip" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not replace release asset for $env:RELEASE_TAG." }
          } else {
            $global:LASTEXITCODE = 0
            gh release create $env:RELEASE_TAG "dist/Vulnus-Windows-x64.zip" --target "$env:GITHUB_SHA" --title "Vulnus Rhythians Windows v0.2.0" --notes "Major compatibility release: Rhythians website-confirmed login, linked-Rhythia access enforcement, full map catalog downloads, ranked/legacy/completion/reward metadata, RPL/RPS score submission, Full Lock/Parallax/Spin modes, universal AR/AD/fade compatibility, Half Ghost, pause/restart/exit, fixed failure handling, customization and RHS/settings/color/cursor presets. Exported natively on Windows with Godot 3.7-dev1 Mono."
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $env:RELEASE_TAG." }
          }
          if ($env:OLD_RELEASE_TAG -and $env:OLD_RELEASE_TAG -ne $env:RELEASE_TAG) {
            gh release view $env:OLD_RELEASE_TAG 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release delete $env:OLD_RELEASE_TAG --cleanup-tag -y
              if ($LASTEXITCODE -ne 0) { throw "Could not delete old release $env:OLD_RELEASE_TAG." }
            } else {
              $global:LASTEXITCODE = 0
            }
          }
